name: Feature request / 기능 제안
description: Propose a change or an improvement. 새 기능이나 개선을 제안합니다. (English or Korean / 한국어로 쓰셔도 됩니다)
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 어떤 문제에서 출발했나요
      description: Who runs into it and when. 누가 언제 겪는 문제인지.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 제안
      description: What should change. Screens, prompts, data, or operations. 무엇을 어떻게 바꾸면 좋을지.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Principles this touches / 지켜야 할 원칙
      description: Tick anything the proposal affects so reviewers look there first. 해당하면 체크해 주세요.
      options:
        - label: Human confirmation before any AI-generated content is published / AI 생성물은 사람이 확인한 뒤에만 공개
        - label: Authors stay hashed; no personal data stored / 작성자 해시·개인정보 미저장
        - label: One visual grammar (paper, ink, 1 px rules; no cards, radius, or shadows) / 「일점 지면」 화면 규약
        - label: Works for another region by changing config/region.ts only / 다른 지역판은 설정 파일만 바꿔 쓸 수 있어야 함
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 대안
